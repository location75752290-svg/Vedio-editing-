name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # STEP 1: Delete old Gradle Wrapper
    - name: Delete old Gradle Wrapper
      run: |
        rm -rf gradle/wrapper/gradle-wrapper.jar
        rm -rf gradle/wrapper/gradle-wrapper.properties

    # STEP 2: Setup JDK 17 and Gradle
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Restore Keystore
      run: |
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore || true
        fi

    - name: Generate new Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5 --distribution-type all

    - name: Make Gradlew Executable
      run: chmod +x gradlew

    - name: Build Release AAB
      run: ./gradlew :app:bundleRelease

    - name: Upload Release AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Release-AAB
        path: app/build/outputs/bundle/release/app-release.aab
