name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 9.3.1

    - name: Restore Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > visioncutai_release.jks
        elif [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore || true
        fi

    - name: Build Release AAB
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: gradle :app:bundleRelease --no-daemon

    - name: Upload Release AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Release-AAB
        path: app/build/outputs/bundle/release/app-release.aab
