name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
        continue-on-error: true
        with:
          allow-checksums: a5e75118d96b4eac2100876f6af6a5ca5029cd440f87736425350fb4cf308b42,b3a875ddc1f044746e1b1a55f645584505f4a10438c1afea9f15e92a7c42ec13,d3b261c2820e9e3d8d639ed084900f11f4a86050a8f83342ade7b6bc9b0d2bdd

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release AAB
        run: ./gradlew :app:bundleRelease

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionCut-AI-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
