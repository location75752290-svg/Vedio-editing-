name: Flutter Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter 3.22.0
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'
        cache: true

    - name: Verify Flutter Installation
      working-directory: ./
      run: flutter --version

    - name: Find pubspec.yaml and Install Dependencies
      working-directory: ./
      run: |
        echo "Current Directory: $(pwd)"
        ls -la
        if [ -f "pubspec.yaml" ]; then
          flutter pub get
        else
          echo "Looking for pubspec.yaml in subdirectories..."
          PUBSPEC_DIR=$(find . -maxdepth 2 -name "pubspec.yaml" -printf '%h\n' | head -n 1)
          if [ -n "$PUBSPEC_DIR" ]; then
            echo "Found pubspec.yaml in $PUBSPEC_DIR"
            cd "$PUBSPEC_DIR"
            flutter pub get
          else
            echo "pubspec.yaml not found, attempting root pub get..."
            flutter pub get || true
          fi
        fi

    - name: Restore Keystore from GitHub Secret
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
      working-directory: ./
      run: |
        mkdir -p android/app
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | grep -v 'CERTIFICATE' | grep -v -- '-----' | tr -d '\r\n ' | base64 -d > android/app/upload-keystore.jks
          echo "Keystore successfully restored at android/app/upload-keystore.jks"
        else
          echo "KEYSTORE_FILE secret is empty!"
        fi

    - name: Create key.properties file
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      working-directory: ./
      run: |
        cat <<EOF > android/key.properties
        storePassword=$KEYSTORE_PASSWORD
        keyPassword=$KEY_PASSWORD
        keyAlias=$KEY_ALIAS
        storeFile=upload-keystore.jks
        EOF
        echo "key.properties successfully created."

    - name: Build Flutter Release APK
      working-directory: ./
      run: flutter build apk --release

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Flutter-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk
