name: Build Native Android Release (APK & AAB)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 9.3.1

    - name: Make Gradlew Executable
      run: chmod +x ./gradlew || true

    - name: Restore Keystore from Secrets
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Decoding release keystore from GitHub Secrets..."
          echo "$KEYSTORE_BASE64" | grep -v 'CERTIFICATE' | grep -v -- '-----' | tr -d '\r\n ' | base64 -d > visioncutai_release.jks
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/visioncutai_release.jks" >> $GITHUB_ENV
        elif [ -f "debug.keystore.base64" ]; then
          echo "Decoding fallback debug keystore..."
          base64 -d debug.keystore.base64 > debug.keystore || true
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/debug.keystore" >> $GITHUB_ENV
        fi

    - name: Prepare Environment Secrets
      env:
        GOOGLE_API_KEY_SECRET: ${{ secrets.GOOGLE_API_KEY }}
      run: |
        if [ -n "$GOOGLE_API_KEY_SECRET" ]; then
          echo "Writing GOOGLE_API_KEY to .env file..."
          echo "GOOGLE_API_KEY=$GOOGLE_API_KEY_SECRET" > .env
        fi

    - name: Build Release APK
      env:
        STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: gradle :app:assembleRelease --no-daemon || ./gradlew :app:assembleRelease --no-daemon

    - name: Build Release AAB (App Bundle)
      env:
        STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: gradle :app:bundleRelease --no-daemon || ./gradlew :app:bundleRelease --no-daemon

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Release-APK
        path: app/build/outputs/apk/release/

    - name: Upload Release AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Release-AAB
        path: app/build/outputs/bundle/release/
