name: Build Native Android Release (APK & AAB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 9.3.1
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 9.3.1

    - name: Make Gradlew Executable
      run: chmod +x ./gradlew || true

    - name: Restore Keystore from GitHub Secrets
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Decoding release keystore from GitHub Secrets..."
          echo "$KEYSTORE_BASE64" | grep -v 'CERTIFICATE' | grep -v -- '-----' | tr -d '\r\n ' | base64 -d > visioncutai_release.jks
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/visioncutai_release.jks" >> $GITHUB_ENV
        elif [ -f "debug.keystore.base64" ]; then
          echo "Decoding fallback debug keystore..."
          base64 -d debug.keystore.base64 > debug.keystore || true
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/debug.keystore" >> $GITHUB_ENV
        fi

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
      run: ./gradlew :app:assembleRelease --no-daemon || gradle :app:assembleRelease --no-daemon

    - name: Build Release AAB (App Bundle)
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
      run: ./gradlew :app:bundleRelease --no-daemon || gradle :app:bundleRelease --no-daemon

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Release-APK
        path: app/build/outputs/apk/release/

    - name: Upload Release AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Release-AAB
        path: app/build/outputs/bundle/release/
