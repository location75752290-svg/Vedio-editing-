name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # STEP 1: Delete old Gradle Wrapper
    - name: Delete old Gradle Wrapper
      run: |
        rm -rf gradle/wrapper/gradle-wrapper.jar
        rm -rf gradle/wrapper/gradle-wrapper.properties

    # STEP 2: Setup JDK and generate fresh valid Gradle Wrapper
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Generate new Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5 --distribution-type all

    # STEP 3: Build Android Release
    - name: Make Gradlew Executable
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease
