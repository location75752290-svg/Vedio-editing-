name: Android Build Fix

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # STEP 1: Delete old Gradle Wrapper
    - name: Delete old Gradle Wrapper
      run: rm -rf gradle/wrapper/

    # STEP 2: Java 17 Setup
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # STEP 3: Gradle 8.5 Setup + generate new wrapper
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Generate new Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5 --distribution-type all

    # STEP 4: Fix Android Gradle Plugin Version
    - name: Fix Android Gradle Plugin Version
      run: |
        sed -i 's/com.android.application.*version.*9.1.1/com.android.application" version "8.3.2"/g' settings.gradle.kts
        sed -i 's/com.android.application.*version.*9.1.1/com.android.application" version "8.3.2"/g' build.gradle.kts

    # STEP 5: Build
    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon
